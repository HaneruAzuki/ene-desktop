<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="860" height="680" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ユーザー(人) -->
  <path d="M48,148 Q48,124 66,124 Q84,124 84,148 L84,160 L48,160 Z" fill="#475569"/>
  <circle cx="66" cy="112" r="15" fill="#475569"/>
  <text x="66" y="182" text-anchor="middle" font-size="13" fill="#1e293b">ユーザー</text>

  <!-- ユーザー ↔ Renderer -->
  <line x1="92" y1="150" x2="162" y2="150" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="127" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">操作・声・表示</text>

  <!-- ローカルPC 境界(破線) -->
  <rect x="130" y="45" width="480" height="575" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="146" y="66" font-size="13" font-weight="bold" fill="#64748b">ローカル PC(この端末)</text>

  <!-- ENE アプリ -->
  <rect x="150" y="80" width="440" height="290" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="165" y="100" font-size="12.5" font-weight="bold" fill="#1d4ed8">ENE アプリ(Electron・1 ウィンドウ)</text>

  <!-- Renderer -->
  <rect x="165" y="112" width="410" height="64" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
  <text x="174" y="132" font-size="12" fill="#1e293b"><tspan font-weight="bold">Renderer(Chromium)</tspan><tspan x="174" dy="16">UI・立ち絵/VRM・マイク取得(getUserMedia)</tspan><tspan x="174" dy="15">吹き出し・ControlBar(ホバー操作バー)</tspan></text>

  <!-- Preload -->
  <rect x="165" y="186" width="410" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
  <text x="174" y="207" font-size="12" fill="#1e293b"><tspan font-weight="bold">preload</tspan> — contextBridge(IPC の橋・最小)</text>

  <!-- Main -->
  <rect x="165" y="230" width="410" height="128" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
  <text x="174" y="250" font-size="12" fill="#1e293b"><tspan font-weight="bold">Main(Node)— オーケストレーション(配線)</tspan><tspan x="174" dy="17">turn-engine(1 ターンの司令塔)</tspan><tspan x="174" dy="16">character / knowledge / memory / conversation</tspan><tspan x="174" dy="16">storage(永続化)・lifecycle(起動準備ゲート)</tspan></text>

  <!-- Renderer↔Preload / Preload↔Main IPC -->
  <line x1="370" y1="176" x2="370" y2="186" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="370" y1="220" x2="370" y2="230" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="470" y="227" font-size="10" fill="#94a3b8">IPC</text>

  <!-- ローカルモデル -->
  <rect x="150" y="392" width="205" height="96" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="413" font-size="12" fill="#065f46"><tspan font-weight="bold">ローカルモデル</tspan><tspan x="160" dy="15">main・onnxruntime-node</tspan><tspan x="160" dy="15">STT(whisper)</tspan><tspan x="160" dy="15">埋め込み(ruri)・Silero VAD</tspan></text>

  <!-- AivisSpeech サイドカー -->
  <rect x="372" y="392" width="218" height="96" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="382" y="413" font-size="12" fill="#065f46"><tspan font-weight="bold">AivisSpeech</tspan><tspan x="382" dy="16">TTS エンジン(別プロセス・サイドカー)</tspan><tspan x="382" dy="16">127.0.0.1:10101(ローカル HTTP)</tspan></text>

  <!-- ファイルシステム -->
  <rect x="150" y="506" width="440" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="527" font-size="12" fill="#92400e"><tspan font-weight="bold">ローカルファイルシステム(data/ = ポータブル)</tspan><tspan x="160" dy="16">data/ … memory・config・logs・models</tspan><tspan x="160" dy="16">data/app/api-key.enc(唯一の暗号化・DPAPI)</tspan><tspan x="160" dy="16">{id}/ … キャラ資産(JSON・.vrm・.aivmx)</tspan></text>

  <!-- Main → ローカルモデル -->
  <line x1="240" y1="358" x2="240" y2="392" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Main → AivisSpeech -->
  <line x1="480" y1="358" x2="480" y2="392" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Main ↔ ファイルシステム -->
  <line x1="363" y1="358" x2="363" y2="506" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="363" y="500" text-anchor="middle" font-size="10" fill="#94a3b8">保存/読込</text>

  <!-- Claude API(クラウド・外部) -->
  <rect x="686" y="250" width="158" height="96" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.7"/>
  <text x="765" y="284" text-anchor="middle" font-size="12.5" fill="#b91c1c"><tspan font-weight="bold">Claude API</tspan><tspan x="765" dy="17">(クラウド・外部)</tspan><tspan x="765" dy="16">会話テキストのみ受信</tspan></text>

  <!-- 唯一の外部送信(赤・破線境界を越える唯一の線) -->
  <line x1="575" y1="292" x2="684" y2="292" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arrowred)"/>
  <text x="630" y="283" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ef4444">会話テキストのみ</text>
  <text x="630" y="312" text-anchor="middle" font-size="9.5" fill="#ef4444">端末を越える唯一の線</text>

  <!-- 凡例 -->
  <g font-size="11" fill="#475569">
    <rect x="150" y="640" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6"/><text x="170" y="651">ENE アプリ</text>
    <rect x="270" y="640" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="290" y="651">ローカル計算(STT/TTS/VAD)</text>
    <rect x="510" y="640" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b"/><text x="530" y="651">ローカルデータ</text>
    <rect x="650" y="640" width="14" height="14" rx="3" fill="#fef2f2" stroke="#ef4444"/><text x="670" y="651">外部(ネットワーク)</text>
  </g>
</svg>
