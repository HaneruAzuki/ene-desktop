appId: io.github.haneruazuki.project-ene
# 製品/表示名(Start メニュー・インストーラ・exe プロパティ)。キャラ名に統一(B-10)。
# userData は app.setName('project-ene') で別途固定するため、ここを変えても API キー保存先は動かない。
productName: 魚川トリミ
directories:
  output: dist
  buildResources: resources
# 配布物に含めるファイル。main/preload/renderer は out/ に自己完結バンドル済み。
# 例外: external 化した実行時依存(electron.vite.config.ts の external＋動的 require)は out/ にバンドルされず、
# 実行時に node_modules から require される。それらをここで明示同梱する(欠けると packaged で機能が無言で死ぬ)。
# ※ 配布サイズ §4.3 を守るため onnxruntime-node の native は CPU・win-x64 のみ(GPU用 DirectML/他OSは除外)。
files:
  - 'out/**/*'
  - 'ene/**/*' # 初期キャラ(JSON + portrait + VRM)を同梱
  - 'resources/**/*' # アイコン等＋ Silero VAD モデル(task_17 Phase C)
  - '!node_modules/**/*'
  # ロガー(logger.ts が動的 require=バンドルされない。欠けるとログが書けず診断不能になる・2026-06)
  - 'node_modules/electron-log/**/*'
  # 埋め込み/STT ランタイム(transformers.js とその実行時依存)。
  # ※ transformers.js の Node ビルド(transformers.node.cjs)は onnxruntime-node＋onnxruntime-common のみを
  #   require する(onnxruntime-web は使わない=同梱不要・確認済み 2026-06)。
  - 'node_modules/@huggingface/transformers/**/*'
  - 'node_modules/@huggingface/jinja/**/*'
  - 'node_modules/@huggingface/tokenizers/**/*'
  - 'node_modules/onnxruntime-common/**/*'
  - 'node_modules/onnxruntime-node/package.json'
  - 'node_modules/onnxruntime-node/lib/**/*'
  - 'node_modules/onnxruntime-node/dist/**/*'
  # native は win-x64 の CPU 推論コアのみ(GPU用 DirectML/他OS は載せない)
  - 'node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime.dll'
  - 'node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime_binding.node'
asar: true
asarUnpack:
  - 'ene/**/*' # キャラ定義はユーザーがカスタマイズ可能なよう展開状態を維持
  - 'node_modules/onnxruntime-node/bin/**/*' # native .dll/.node は asar 外でないとロードできない
  - 'resources/silero_vad.onnx' # VAD モデルは native onnxruntime-node が直接読む=asar 外が必須(task_17 Phase C)
win:
  target:
    # NSIS インストーラ配布(2026-06・N-REL-2): 「説明を読まない人」が DL→ダブルクリック→自動セットアップ。
    # per-user(管理者不要)・自動更新(electron-updater)・標準アンインストール。旧ポータブル zip から転換。
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
# NSIS インストーラ設定(N-REL-2)。
#  - oneClick=最小UX(読まずに入る・完了後に自動起動)/ perMachine:false=ユーザー領域=管理者不要(UAC なし)
#  - deleteAppDataOnUninstall:false=**ユーザーの記憶は既定で残す**(不具合→再インストールで戻せる)。
#    完全削除/エクスポートはアプリ内で行う。AivisSpeech エンジン残骸は include のフックで除去(共存セーフ)。
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
# 自動更新のバックエンド(electron-updater が GitHub Releases の latest.yml をここから取得)。公開リポジトリ。
publish:
  provider: github
  owner: HaneruAzuki
  repo: ene-desktop
# 配布物の ASCII 安全名(日本語ファイル名は DL で文字化け・破損リスク)。インストーラ= Torimi-Setup-<ver>.exe。
artifactName: Torimi-Setup-${version}.${ext}
# モデル/音声エンジン(計約1.5GB)を **asar 外の素ファイル**として exe 隣の data/ へ同梱する。
# transformers.js / AivisSpeech エンジンは実体ファイルを直接読むため asar には入れられない。
# 同梱先は dev と同じ相対パス(data/models・data/voice/engine)=getModelsDir/getVoiceEngineDir は無改修。
# ⚠️ 同梱元(下記 from)は配置済みであること(npm run download:model / download:stt-model / setup:voice-engine)。
# 声モデル(torimi)＋BERT はエンジンが %APPDATA%\AivisSpeech-Engine へ保存する(変更不可)ため、それらを
# data/voice/userdata に同梱し、初回起動で %APPDATA% へ**配置**する(N-REL-2・engine-userdata.ts)。
# 標準版 AivisSpeech 同居時は torimi(UUID)だけ追加し、アンインストール時にフック(installer.nsh)で除去する。
# 同梱元は npm run setup:engine-userdata で配置。
extraFiles:
  # 第三者ライセンス表記(配布物の分かりやすい場所=exe 隣に置く。LGPL/MIT/Apache の表示義務＋つくよみクレジット)
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # STT は kotoba-whisper-v2.2 を既定とする(2026-06-17・日本語精度優先・constants.ts STT_MODEL_DIR と一致)
  - from: data/models/kotoba-whisper-v2.2
    to: data/models/kotoba-whisper-v2.2
  - from: data/models/ruri-v3-310m
    to: data/models/ruri-v3-310m
  - from: data/voice/engine
    to: data/voice/engine
  # エンジンのユーザデータ root(torimi モデル＋BERT)。初回起動で %APPDATA%\AivisSpeech-Engine へ
  # 配置する(N-REL-2・共存時は torimi のみ)。npm run setup:engine-userdata で配置。
  - from: data/voice/userdata
    to: data/voice/userdata
# 配布サイズ削減: 同梱するロケールを絞る(NF-SIZE-01)
electronLanguages:
  - ja
  - en-US
